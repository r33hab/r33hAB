name: snake

# Draws the contribution-graph snake and publishes it to the `output` branch,
# where the README picks it up.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#fe8019&color_dots=#161b22,#3c3836,#79740e,#b8bb26,#fabd2f
            dist/snake-light.svg?color_snake=#af3a03&color_dots=#ebedf0,#f2e5bc,#d79921,#b57614,#79740e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
