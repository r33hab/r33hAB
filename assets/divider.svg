<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="img" aria-label="divider">
<title>divider</title>
<style>
.mono{font-family:ui-monospace,'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,monospace}
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.run{fill:none;stroke:url(#pulse);stroke-width:2.4;stroke-linecap:round;stroke-dasharray:10 300;
  animation:run 5s linear infinite}
@keyframes run{0%{stroke-dashoffset:10}90%,100%{stroke-dashoffset:-100}}
.h{fill:#a78bfa;opacity:0;transform-box:fill-box;transform-origin:center;animation:fire 5s ease-out infinite backwards}
@keyframes fire{0%{opacity:0;transform:scale(.4)}2%{opacity:.8;transform:scale(1)}12%,100%{opacity:0;transform:scale(1.8)}}
</style>

<defs>
  <linearGradient id="fade" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#928374" stop-opacity="0"/><stop offset=".5" stop-color="#928374" stop-opacity=".8"/>
    <stop offset="1" stop-color="#928374" stop-opacity="0"/></linearGradient>
  <linearGradient id="pulse" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
</defs>
<line x1="0" y1="12" x2="1000" y2="12" stroke="url(#fade)"/>
<path d="M0 12H1000" pathLength="100" class="run"/>
<circle cx="250" cy="12" r="3.5" fill="none" stroke="#928374" stroke-width="1.4"/><circle cx="250" cy="12" r="6" class="h" style="animation-delay:1.12s"/><circle cx="500" cy="12" r="3.5" fill="none" stroke="#928374" stroke-width="1.4"/><circle cx="500" cy="12" r="6" class="h" style="animation-delay:2.25s"/><circle cx="750" cy="12" r="3.5" fill="none" stroke="#928374" stroke-width="1.4"/><circle cx="750" cy="12" r="6" class="h" style="animation-delay:3.38s"/>
</svg>
